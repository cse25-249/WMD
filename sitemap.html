<!DOCTYPE html>
<html>
<head>
    <title>Sitemap</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }
        .box {
            border: 2px solid black;
            padding: 10px;
            margin: 10px;
            display: inline-block;
            width: 180px;
        }
        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

<h1>Website Sitemap</h1>

<div class="box">Home</div>

<div class="container">
    <div class="box">Hair Salons</div>
    <div class="box">Nail Salons</div>
    <div class="box">Makeup</div>
    <div class="box">Manicure</div>
    <div class="box">Pedicure</div>
</div>

<div class="container">
    <div class="box">Salon Profile</div>
    <div class="box">List Your Business</div>
    <div class="box">About</div>
</div>

</body>
</html>
