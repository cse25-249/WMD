<!doctype>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title> PATIENCE HAIRDRESSING BOOKINGS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1

    <style>
     < body>{
      font-family:Arial, san-serif:
      background:#f2f2f2;
      padding:20px
      }
      .box{
      background:#fff; 
      padding:20px;
      max-width:400px;
      margin:auto;
      border-radius:6px;
      }
      label{
      display:block;
      margin-top:12px;
      font-weight:bold;
      }
      input,select, button{
      width:100%;
      padding:8px;
      margin-top:5px;
      }
      button{
      margin-top:15px;
      background:black;
      colour:white;
      border:none;
      }
      </style>
  </head>

      <body>
      <div class="box">
    <h2>PATIENCE HAIRDRESSING</h2>
    <P>BOOK YOUR APPOINTMENT</P>

    <form.
      <label>name</label>
      <input type="text" required>

      <label>phone</label>
      <input type="phone" required>

      <label>services</label>
      <select required>
        <option value="">select service</option>
        <option>knotless braids</option>
        <option>cornrow</option>
        <option>carrot</option>
        <option>tribal braids</option>

        <label>date</label>
        <input type="date" required>

        <label>time</label>
        <select required>
          <option value="">select time</option>
          <option>08:00-10:00</option>
          <option>10:00-12:00</option>
          <option>12:00-14:00</option>
          <option>14:00-16:00</option>
        </select>

        <button type="submit">Book</button>
      </form>
      </div>

      </body>
      </html>
